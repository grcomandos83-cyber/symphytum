name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            qt_arch: win64_mingw81
          - os: ubuntu-latest
            name: Linux
            qt_arch: gcc_64
          - os: macos-latest
            name: macOS
            qt_arch: clang_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # WINDOWS BUILD
      # -------------------------------------------------------------
      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw81'
          tools: 'tools_mingw81'

      - name: Build & Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v',''
          New-Item -ItemType Directory -Path dist -Force

          # Find and set 64-bit MinGW
          $mingwItem = Get-ChildItem -Path "D:\a", "C:\hostedtoolcache", "C:\Qt" -Filter "g++.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*64*" } | Select-Object -First 1
          if ($mingwItem) {
              $mingwDir = $mingwItem.DirectoryName
              Write-Host "Found 64-bit MinGW at: $mingwDir"
              $env:PATH = "$mingwDir;$env:PATH"
          }

          # Update translations
          lrelease Symphytum.pro
          if (Test-Path "stuff\translations\symphytum_el.qm") {
              Copy-Item "stuff\translations\symphytum_el.qm" "resources\languages\" -Force
          }

          # Configure and compile with CMake & MinGW 64-bit
          cmake -B build -DCMAKE_BUILD_TYPE=Release -G "MinGW Makefiles" -DCMAKE_C_COMPILER="$mingwDir/gcc.exe" -DCMAKE_CXX_COMPILER="$mingwDir/g++.exe"
          cmake --build build --config Release --parallel

          # Locate built executable
          $exe = Get-ChildItem -Path "build" -Filter "symphytum.exe" -Recurse | Select-Object -First 1
          if (-not $exe) {
              throw "symphytum.exe was not found in build directory!"
          }

          # Prepare staging folder for installer
          $stageDir = "dist\staging"
          New-Item -ItemType Directory -Path $stageDir -Force
          Copy-Item $exe.FullName -Destination $stageDir -Force

          # Deploy Qt dependencies
          $qtBin = (Get-Command qmake.exe -ErrorAction SilentlyContinue).Source | Split-Path
          if ($qtBin -and (Test-Path "$qtBin\windeployqt.exe")) {
              & "$qtBin\windeployqt.exe" --release --no-translations "$stageDir\symphytum.exe"
          } else {
              windeployqt --release --no-translations "$stageDir\symphytum.exe"
          }

          # Copy MinGW runtime DLLs
          if ($mingwDir) {
              Copy-Item "$mingwDir\libgcc_s_*.dll" -Destination $stageDir -Force -ErrorAction SilentlyContinue
              Copy-Item "$mingwDir\libstdc++-*.dll" -Destination $stageDir -Force -ErrorAction SilentlyContinue
              Copy-Item "$mingwDir\libwinpthread-*.dll" -Destination $stageDir -Force -ErrorAction SilentlyContinue
          }

          # Build Inno Setup Installer
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
              & $iscc "/DMyAppVersion=$ver" "/DOutputDir=..\..\dist" "/DSourceDir=..\..\dist\staging" "/DOutputBaseFilename=symphytum-$ver-setup" "stuff\installers\symphytum.iss"
          }

          # Clean up staging directory
          Remove-Item -Recurse -Force $stageDir

      # -------------------------------------------------------------
      # LINUX BUILD
      # -------------------------------------------------------------
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgl1-mesa-dev qttools5-dev-tools

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          arch: 'gcc_64'

      - name: Build & Package (Linux)
        if: runner.os == 'Linux'
        run: |
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          # Build translations & application
          lrelease Symphytum.pro || true
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j$(nproc)

          # Package portable tar.gz
          stageDir="dist/Symphytum-${ver}-Linux-x86_64"
          mkdir -p "$stageDir/bin" "$stageDir/share/applications" "$stageDir/share/icons/hicolor/64x64/apps"
          cp build/symphytum "$stageDir/bin/"
          cp LICENSE "$stageDir/"
          cp README.md "$stageDir/"
          cp resources/images/icons/symphytum.png "$stageDir/share/icons/hicolor/64x64/apps/"
          tar -czvf "dist/Symphytum-${ver}-Linux-x86_64.tar.gz" -C dist "Symphytum-${ver}-Linux-x86_64"

      # -------------------------------------------------------------
      # MACOS BUILD
      # -------------------------------------------------------------
      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          arch: 'clang_64'

      - name: Build & Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          # Build translations & application bundle targeting x86_64 (matching Qt 5.15.2)
          lrelease Symphytum.pro || true
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build build --config Release -j$(sysctl -n hw.ncpu)

          # Find bundle and create DMG / ZIP
          appPath=$(find build -name "symphytum.app" -o -name "Symphytum.app" | head -n 1)
          if [ -d "$appPath" ]; then
            macdeployqt "$appPath" -dmg || true
            dmgPath=$(find build -name "*.dmg" | head -n 1)
            if [ -f "$dmgPath" ]; then
              cp "$dmgPath" "dist/Symphytum-${ver}-macOS.dmg"
            fi
            ditto -c -k --sequesterRsrc --keepParent "$appPath" "dist/Symphytum-${ver}-macOS.zip"
          else
            tar -czvf "dist/Symphytum-${ver}-macOS.tar.gz" -C build symphytum
          fi

      # -------------------------------------------------------------
      # PUBLISH ARTIFACTS TO GITHUB RELEASE
      # -------------------------------------------------------------
      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
